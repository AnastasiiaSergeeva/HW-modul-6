<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стилист — подбор причёски и цвета волос</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>💇‍♀️ Виртуальный стилист</h1>
        <p>Подберите причёску и цвет волос, посмотрите результат на аватаре</p>
    </header>

    <main class="layout">
        <!-- Превью аватара -->
        <section class="preview-card">
            <h2>Превью</h2>
            <div class="avatar-wrap">
                <svg id="avatar" viewBox="0 0 300 340" aria-label="Аватар с выбранной причёской">
                    <!-- Слой волос сзади (заполняется скриптом) -->
                    <g id="hair-back"></g>
                    <!-- Шея и плечи -->
                    <path d="M128 240 h44 v30 q40 8 52 40 h-148 q12-32 52-40 z" fill="var(--skin)"/>
                    <path d="M98 310 q52-22 104 0 v30 h-104 z" fill="#7c8ce0"/>
                    <!-- Голова -->
                    <ellipse cx="150" cy="165" rx="62" ry="75" fill="var(--skin)"/>
                    <!-- Уши -->
                    <ellipse cx="88" cy="175" rx="10" ry="16" fill="var(--skin)"/>
                    <ellipse cx="212" cy="175" rx="10" ry="16" fill="var(--skin)"/>
                    <!-- Лицо -->
                    <g id="face">
                        <ellipse cx="127" cy="160" rx="7" ry="9" fill="#3b2f2f"/>
                        <ellipse cx="173" cy="160" rx="7" ry="9" fill="#3b2f2f"/>
                        <path d="M120 143 q7-7 15-3" stroke="#3b2f2f" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M165 140 q8-4 15 3" stroke="#3b2f2f" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M147 175 q3 8 -2 12 q3 3 8 1" stroke="#c98e6d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        <path d="M133 210 q17 12 34 0" stroke="#b3556a" stroke-width="5" fill="none" stroke-linecap="round"/>
                        <ellipse cx="113" cy="192" rx="9" ry="5" fill="#e8a0a0" opacity="0.45"/>
                        <ellipse cx="187" cy="192" rx="9" ry="5" fill="#e8a0a0" opacity="0.45"/>
                    </g>
                    <!-- Слой волос спереди (заполняется скриптом) -->
                    <g id="hair-front"></g>
                </svg>
            </div>
            <div class="preview-info">
                <p id="current-choice">Выберите причёску и цвет</p>
            </div>
            <div class="preview-actions">
                <button id="btn-random" class="btn" type="button">🎲 Случайный образ</button>
                <button id="btn-save" class="btn btn-primary" type="button">⭐ Сохранить образ</button>
            </div>
        </section>

        <!-- Панель выбора -->
        <section class="controls">
            <div class="control-group">
                <h2>Форма лица <span class="hint">— подсветим подходящие причёски</span></h2>
                <div id="face-shapes" class="chip-row"></div>
                <p id="shape-tip" class="shape-tip"></p>
            </div>

            <div class="control-group">
                <h2>Причёска</h2>
                <div id="hairstyles" class="style-grid"></div>
            </div>

            <div class="control-group">
                <h2>Цвет волос</h2>
                <div id="colors" class="swatch-row"></div>
                <label class="custom-color">
                    Свой цвет:
                    <input type="color" id="custom-color" value="#6b4226">
                </label>
            </div>

            <div class="control-group">
                <h2>Тон кожи</h2>
                <div id="skins" class="swatch-row"></div>
            </div>

            <div class="control-group">
                <h2>Сохранённые образы</h2>
                <div id="favorites" class="fav-list"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
